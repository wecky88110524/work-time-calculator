<!DOCTYPE html>
<!-- saved from url=(0040)https://web-sandbox.oaiusercontent.com/? -->
<html lang="zh-Hant-TW"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作時間計算器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      background: #f4f7f9; color: #333; min-height: 100vh;
      display: flex; justify-content: center; align-items: flex-start;
      padding: 40px 16px;
    }
    .container {
      width: 100%; max-width: 680px; background: #fff; border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08); overflow: hidden;
    }
    .header { background: #2f6f68; color: white; text-align: center; padding: 26px 20px; }
    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .header p { font-size: 14px; opacity: .9; }
    .content { padding: 30px; }
    .time-section { padding: 22px; border: 1px solid #e1e7e9; border-radius: 12px; background: #fafcfc; }
    .time-section h2 { font-size: 19px; color: #2f6f68; margin-bottom: 18px; }
    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 15px; font-weight: 600; color: #444; }
    .form-group input {
      width: 100%; height: 50px; padding: 10px 13px; border: 1px solid #ccd6d9;
      border-radius: 8px; background: #fff; font-size: 17px;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
    }
    .form-group input:focus { outline: none; border-color: #2f6f68; box-shadow: 0 0 0 3px rgba(47,111,104,.12); }
    .arrow { text-align: center; font-size: 28px; color: #2f6f68; padding: 13px 0; }
    .button-group { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 25px; }
    button {
      height: 52px; border: none; border-radius: 9px; font-size: 16px; font-weight: 700;
      font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif; cursor: pointer;
    }
    .calculate-btn { background: #2f6f68; color: white; }
    .calculate-btn:hover { background: #275e58; }
    .clear-btn { background: #e9eef0; color: #49565a; }
    .clear-btn:hover { background: #dbe3e6; }
    .message { display: none; margin-top: 20px; padding: 14px 16px; border-radius: 8px; font-size: 15px; line-height: 1.6; }
    .message.error { display: block; background: #fff1f0; color: #b42318; border: 1px solid #f5c6c2; }
    .result { display: none; margin-top: 25px; border: 1px solid #d7e4e2; border-radius: 12px; overflow: hidden; }
    .result.show { display: block; }
    .result-title { padding: 15px 20px; background: #edf5f4; color: #2f6f68; font-size: 18px; font-weight: 700; }
    .main-result { padding: 25px 20px; text-align: center; border-bottom: 1px solid #e5ebed; }
    .main-result .label { font-size: 15px; color: #667075; margin-bottom: 10px; }
    .main-result .value { font-size: 34px; line-height: 1.3; font-weight: 800; color: #2f6f68; }
    .detail-result { display: grid; grid-template-columns: 1fr 1fr; }
    .detail-item { padding: 20px; text-align: center; background: #fafcfc; }
    .detail-item:first-child { border-right: 1px solid #e5ebed; }
    .detail-label { font-size: 14px; color: #747f83; margin-bottom: 7px; }
    .detail-value { font-size: 20px; font-weight: 700; }
    .time-summary { margin-top: 18px; padding: 14px 16px; background: #f7f9fa; border-radius: 8px; font-size: 14px; line-height: 1.8; color: #596469; }
    @media (max-width: 600px) {
      body { padding: 15px 10px; background: #fff; }
      .container { box-shadow: none; border-radius: 0; }
      .header { padding: 22px 15px; border-radius: 12px; }
      .header h1 { font-size: 24px; }
      .content { padding: 22px 5px; }
      .time-section { padding: 18px 15px; }
      .input-grid { grid-template-columns: 1fr; gap: 14px; }
      .form-group input { height: 52px; font-size: 18px; }
      .button-group { grid-template-columns: 1fr; }
      .main-result .value { font-size: 28px; }
      .detail-result { grid-template-columns: 1fr; }
      .detail-item:first-child { border-right: none; border-bottom: 1px solid #e5ebed; }
    }
  </style>
<style>html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:transparent}html.chatgptOled.dark,html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}html.desktopSkybridge [data-openai-titlebar]{padding-left:calc(8px + var(--openai-titlebar-left-inset, 0px));padding-right:8px}html.transparentSkybridgeBackground,html.transparentSkybridgeBackground.dark{background-color:transparent}html.androidSkybridge,html.androidSkybridge body,html.androidSkybridge *{-webkit-tap-highlight-color:rgba(255,255,255,0)}html.androidSkybridge *::selection,html.androidSkybridge *::-moz-selection{background:#fff0;color:inherit}</style></head>
<body>
  <main class="container">
    <header class="header">
      <h1>工作時間計算器</h1>
      <p>輸入開始與結束日期時間，自動計算總工作時間</p>
    </header>
    <div class="content">
      <section class="time-section">
        <h2>開始時間</h2>
        <div class="input-grid">
          <div class="form-group">
            <label for="startDate">開始日期</label>
            <input type="date" id="startDate">
          </div>
          <div class="form-group">
            <label for="startTime">開始時間</label>
            <input type="time" id="startTime" step="60">
          </div>
        </div>
      </section>

      <div class="arrow">↓</div>

      <section class="time-section">
        <h2>結束時間</h2>
        <div class="input-grid">
          <div class="form-group">
            <label for="endDate">結束日期</label>
            <input type="date" id="endDate">
          </div>
          <div class="form-group">
            <label for="endTime">結束時間</label>
            <input type="time" id="endTime" step="60">
          </div>
        </div>
      </section>

      <div class="button-group">
        <button class="calculate-btn" id="calculateBtn">計算工作時間</button>
        <button class="clear-btn" id="clearBtn">清除重填</button>
      </div>

      <div id="message" class="message" role="alert"></div>

      <section id="result" class="result">
        <div class="result-title">計算結果</div>
        <div class="main-result">
          <div class="label">總工作時間</div>
          <div class="value" id="workTimeResult">0 小時 0 分鐘</div>
        </div>
        <div class="detail-result">
          <div class="detail-item">
            <div class="detail-label">總分鐘</div>
            <div class="detail-value" id="totalMinutesResult">0 分鐘</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">十進位工時</div>
            <div class="detail-value" id="decimalHoursResult">0.00 小時</div>
          </div>
        </div>
        <div class="time-summary" id="timeSummary"></div>
      </section>
    </div>
  </main>

<script>
const $ = id => document.getElementById(id);
const startDateInput = $("startDate");
const startTimeInput = $("startTime");
const endDateInput = $("endDate");
const endTimeInput = $("endTime");
const messageBox = $("message");
const resultBox = $("result");

function getTimestamp(dateValue, timeValue) {
  const [y, m, d] = dateValue.split("-").map(Number);
  const [hh, mm] = timeValue.split(":").map(Number);
  if (![y,m,d,hh,mm].every(Number.isFinite)) return NaN;
  return Date.UTC(y, m - 1, d, hh, mm, 0, 0);
}

function formatDate(v) {
  if (!v) return "";
  const [y,m,d] = v.split("-");
  return `${y}/${m}/${d}`;
}

function formatTime(v) {
  if (!v) return "";
  const [h,m] = v.split(":");
  return `${h.padStart(2,"0")}:${m.padStart(2,"0")}`;
}

function showError(text) {
  messageBox.textContent = text;
  messageBox.className = "message error";
  resultBox.classList.remove("show");
}

function clearMessage() {
  messageBox.textContent = "";
  messageBox.className = "message";
}

function calculateWorkTime() {
  clearMessage();

  const sd = startDateInput.value;
  const st = startTimeInput.value;
  const ed = endDateInput.value;
  const et = endTimeInput.value;

  if (!sd || !st || !ed || !et) {
    showError("請完整輸入開始與結束日期、時間。");
    return;
  }

  const start = getTimestamp(sd, st);
  const end = getTimestamp(ed, et);

  if (!Number.isFinite(start) || !Number.isFinite(end)) {
    showError("日期或時間格式錯誤，請重新確認。");
    return;
  }

  if (end < start) {
    showError("結束日期時間不可早於開始日期時間，請重新確認。");
    return;
  }

  const totalMinutes = Math.floor((end - start) / 60000);
  const hours = Math.floor(totalMinutes / 60);
  const minutes = totalMinutes % 60;
  const decimalHours = (totalMinutes / 60).toFixed(2);

  $("workTimeResult").textContent = `${hours} 小時 ${minutes} 分鐘`;
  $("totalMinutesResult").textContent = `${totalMinutes} 分鐘`;
  $("decimalHoursResult").textContent = `${decimalHours} 小時`;
  $("timeSummary").innerHTML =
    `<strong>開始：</strong>${formatDate(sd)} ${formatTime(st)}<br>` +
    `<strong>結束：</strong>${formatDate(ed)} ${formatTime(et)}`;

  resultBox.classList.add("show");
}

function clearAll() {
  [startDateInput, startTimeInput, endDateInput, endTimeInput].forEach(el => el.value = "");
  $("workTimeResult").textContent = "0 小時 0 分鐘";
  $("totalMinutesResult").textContent = "0 分鐘";
  $("decimalHoursResult").textContent = "0.00 小時";
  $("timeSummary").innerHTML = "";
  clearMessage();
  resultBox.classList.remove("show");
  startDateInput.focus();
}

$("calculateBtn").addEventListener("click", calculateWorkTime);
$("clearBtn").addEventListener("click", clearAll);

[startDateInput, startTimeInput, endDateInput, endTimeInput].forEach(input => {
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      calculateWorkTime();
    }
  });
});
</script>

</body></html>
